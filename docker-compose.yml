version: '3.8'

services:
  # ============================================
  # データベース
  # ============================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ceoos-postgres
    environment:
      POSTGRES_USER: ceoos
      POSTGRES_PASSWORD: ceoos_dev
      POSTGRES_DB: ceoos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceoos"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: ceoos-timescaledb
    environment:
      POSTGRES_USER: ceoos
      POSTGRES_PASSWORD: ceoos_dev
      POSTGRES_DB: ceoos_ts
    ports:
      - "5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data

  # ============================================
  # キャッシュ・メッセージ
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ceoos-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ceoos-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ceoos
      RABBITMQ_DEFAULT_PASS: ceoos_dev
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitdata:/var/lib/rabbitmq

  # ============================================
  # 検索・オブジェクトストレージ
  # ============================================
  elasticsearch:
    image: elasticsearch:8.14.0
    container_name: ceoos-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: kibana:8.14.0
    container_name: ceoos-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  minio:
    image: minio/minio:latest
    container_name: ceoos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Console
    volumes:
      - miniodata:/data

  # ============================================
  # Kafka (イベントバス)
  # ============================================
  kafka:
    image: bitnami/kafka:3.7
    container_name: ceoos-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/bitnami/kafka

volumes:
  pgdata:
  tsdata:
  redisdata:
  rabbitdata:
  esdata:
  miniodata:
  kafkadata:
