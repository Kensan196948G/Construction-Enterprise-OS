name: Mirai Web CAD Production

on:
  push:
    branches:
      - "fix/auth-guard-fail-closed"
    paths:
      - "Mirai-Web-CAD/**"
      - ".github/workflows/mirai-web-cad-production.yml"
  workflow_dispatch:

concurrency:
  group: mirai-web-cad-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mirai-Web-CAD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Mirai-Web-CAD/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  deploy:
    name: Deploy Cloudflare Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mirai-web-cad.mirai-dx-platform.com
    defaults:
      run:
        working-directory: Mirai-Web-CAD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Mirai-Web-CAD/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy production branch
        run: >-
          npx wrangler pages deploy dist
          --project-name mirai-web-cad
          --branch "$GITHUB_REF_NAME"
          --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public boundary
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://mirai-web-cad.pages.dev/)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://mirai-web-cad.pages.dev/api/health)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://mirai-web-cad.mirai-dx-platform.com/)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://mirai-web-cad.mirai-dx-platform.com/api/health)" = "401"
