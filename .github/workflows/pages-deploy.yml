name: Pages Deploy (MVP WebUI)

on:
  push:
    branches: [main]
    paths:
      - 'webui/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy-webui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm i -g wrangler@4

      - name: Prepare deploy directory
        run: |
          mkdir -p .deploy-webui
          cp "webui/Construction-Enterprise-OS---Standalone-_1_.html" .deploy-webui/index.html
          cp "webui/Construction-Enterprise-OS---Standalone-_1_.html" ".deploy-webui/Construction-Enterprise-OS---Standalone-_1_.html"
          cp webui/brand-spec.md webui/DESIGN-HANDOFF.md webui/DESIGN-MANIFEST.json .deploy-webui/
          cp webui/index.html .deploy-webui/management-review-deck.html
          ls -la .deploy-webui/

      - name: Deploy to Cloudflare Pages (construction-os-mvp)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy .deploy-webui --project-name construction-os-mvp --branch main
